<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>TechShop</h1>
    <p>Магазин электроники</p>
</header>
<main>
    <h2>Наши товары</h2>
    <div class="product">
        <div class="product-image">🎧</div>
        <h3>Беспроводные наушники</h3>
        <p>Bluetooth, встроенный микрофон</p>
        <p class="price">2500 ₽</p>
        <button id="buy">Купить</button>
        <button id="details">Подробнее</button>
        <button id="dostavka">Доставка</button>
        <p id="message"></p>
        <p id="info"></p>
        <p id="delivery"></p>
        <button id="del" type="button">x</button>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
